# What a character can bring out on their own word, by trade. A subrole is
# matched by keyword, case-insensitive substring ("charcoal_merchant" →
# merchant). Values are item-library categories. No match → the character
# has nothing to put on the table; most people don't. Staff of a stocked
# venue add its `shop` categories on top (Items::Offers.categories_for).
smith:      [weapons, armor, goods]
armourer:   [armor]
armorer:    [armor]
fletcher:   [weapons]
bowyer:     [weapons]
jewel:      [jewelry]
goldsmith:  [jewelry]
silversmith: [jewelry]
tanner:     [goods]
leather:    [goods]
furrier:    [goods]
trapper:    [goods]
weaver:     [goods]
tailor:     [goods]
spinner:    [goods]
dyer:       [goods]
carpenter:  [goods]
sawyer:     [goods]
logger:     [goods]
woodcutter: [goods]
woodsman:   [goods]
charcoal:   [goods]
collier:    [goods]
timber:     [goods]
lumber:     [goods]
joiner:     [goods]
wheelwright: [goods]
potter:     [goods]
mason:      [goods]
cooper:     [goods]
rope:       [goods]
net:        [goods]
mender:     [goods]
chandler:   [goods, provisions]
merchant:   [goods, provisions]
vendor:     [goods, provisions]
trader:     [goods, provisions]
peddler:    [goods, provisions, jewelry]
hawker:     [goods, provisions]
shopkeep:   [goods, provisions]
innkeep:    [provisions]
barkeep:    [provisions]
tavern:     [provisions]
alewife:    [provisions]
barmaid:    [provisions]
tapster:    [provisions]
potboy:     [provisions]
server:     [provisions]
serving:    [provisions]
brewer:     [provisions]
baker:      [provisions]
cook:       [provisions]
fish:       [provisions]
hunter:     [provisions, goods]
herder:     [goods, provisions]
shepherd:   [goods]
farmer:     [provisions]
farmhand:   [provisions]
miller:     [provisions]
butcher:    [provisions]
